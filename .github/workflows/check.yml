name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: sync.sh is executable
        run: test "$(stat -c %a sync.sh)" = "755"

      - name: check on a missing target exits 1
        run: |
          set +e
          ./sync.sh --check --target "$RUNNER_TEMP/t" >/dev/null
          code=$?
          set -e
          test "$code" = "1"

      - name: install, then check exits 0
        run: |
          ./sync.sh --target "$RUNNER_TEMP/t"
          ./sync.sh --check --target "$RUNNER_TEMP/t"

      - name: unknown argument exits 2
        run: |
          set +e
          ./sync.sh --bogus >/dev/null 2>&1
          code=$?
          set -e
          test "$code" = "2"

      - name: local edit is backed up
        run: |
          echo "my line" >> "$RUNNER_TEMP/t/AGENTS.md"
          ./sync.sh --target "$RUNNER_TEMP/t" | grep -q "backup: AGENTS.md.bak"
          grep -q "my line" "$RUNNER_TEMP/t/AGENTS.md.bak"
          ./sync.sh --check --target "$RUNNER_TEMP/t"

      - name: foreign AGENTS.md is left intact
        run: |
          mkdir -p "$RUNNER_TEMP/f"
          printf '%s\n' '<!-- agent-ops mentioned -->' > "$RUNNER_TEMP/f/AGENTS.md"
          set +e
          ./sync.sh --target "$RUNNER_TEMP/f" >/dev/null 2>&1
          code=$?
          set -e
          test "$code" = "1"
          test "$(cat "$RUNNER_TEMP/f/AGENTS.md")" = "<!-- agent-ops mentioned -->"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Actions closes every pwsh step with
      #   if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }
      # so a step that asserts a non-zero code must end with `exit 0`, or the
      # step fails on the very code it just accepted. Verified 2026-11-18: run 1
      # and run 2 failed here, not in sync.ps1.
      - name: reported version
        shell: pwsh
        run: Write-Output "PowerShell $($PSVersionTable.PSVersion) / $($PSVersionTable.OS)"

      - name: install, then check exits 0
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 't'
          ./sync.ps1 -Target $t
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::install exit $LASTEXITCODE"; exit 1 }
          ./sync.ps1 -Check -Target $t
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::check exit $LASTEXITCODE"; exit 1 }
          exit 0

      - name: unknown argument exits 2
        shell: pwsh
        run: |
          ./sync.ps1 -Bogus
          $code = $LASTEXITCODE
          if ($code -ne 2) {
            Write-Output "::error::-Bogus exit $code, expected 2 (PowerShell $($PSVersionTable.PSVersion))"
            exit 1
          }
          exit 0

      - name: local edit is backed up
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 't'
          Add-Content -Path (Join-Path $t 'AGENTS.md') -Value 'my line'
          ./sync.ps1 -Target $t
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::install exit $LASTEXITCODE"; exit 1 }
          if (-not (Select-String -Path (Join-Path $t 'AGENTS.md.bak') -Pattern 'my line' -Quiet)) {
            Write-Output '::error::no backup of the edited AGENTS.md'
            exit 1
          }
          exit 0

      - name: foreign AGENTS.md is left intact
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'f'
          New-Item -ItemType Directory -Path $f -Force | Out-Null
          Set-Content -Path (Join-Path $f 'AGENTS.md') -Value '<!-- agent-ops mentioned -->'
          ./sync.ps1 -Target $f
          $code = $LASTEXITCODE
          if ($code -ne 1) { Write-Output "::error::foreign exit $code, expected 1"; exit 1 }
          $txt = (Get-Content -LiteralPath (Join-Path $f 'AGENTS.md') -Raw).Trim()
          if ($txt -ne '<!-- agent-ops mentioned -->') {
            Write-Output '::error::the foreign AGENTS.md was changed'
            exit 1
          }
          exit 0
